<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Прототип онлайн-школы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: «тетрадь в клетку» — светлая бумага с сеткой, меловой зелёный для действий, жёлтый маркер для главного. Одна колонка на телефоне. */
:root{
  --bg:#F5F7F4; --surface:#FFFFFF; --ink:#14201B; --muted:#5A6862; --line:#DCE3DE; --grid:rgba(30,91,74,.07);
  --brand:#1E5B4A; --brand-2:#174A3C; --on-brand:#FFFFFF; --soft:#E7EFEA;
  --mark:#FFD84D; --on-mark:#14201B;
  --ok:#1F8A5B; --ok-bg:#E2F3EA; --warn:#A86A00; --warn-bg:#FFF1D1; --bad:#B9412B; --bad-bg:#FBE5DF; --info:#2D5FA8; --info-bg:#E3ECF9;
  --d-a:#DCEBFF; --d-b:#FFE3D6; --d-c:#E2F2DC; --d-d:#EFE2FA; --d-ink:#14201B;
  --shadow:0 1px 2px rgba(20,32,27,.05),0 8px 24px rgba(20,32,27,.06);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201C; --ink:#E6EEE9; --muted:#9AAAA2; --line:#28352F; --grid:rgba(111,195,166,.06);
  --brand:#6FC3A6; --brand-2:#8AD3B9; --on-brand:#0E1512; --soft:#1B2A24;
  --mark:#F2C94C; --on-mark:#14201B;
  --ok:#5BCB93; --ok-bg:#16352A; --warn:#E8B44E; --warn-bg:#3A2E12; --bad:#F08B74; --bad-bg:#3D211B; --info:#8DB4EE; --info-bg:#1A2B44;
  --d-a:#1D2E45; --d-b:#43281E; --d-c:#22361F; --d-d:#33253F; --d-ink:#E6EEE9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201C; --ink:#E6EEE9; --muted:#9AAAA2; --line:#28352F; --grid:rgba(111,195,166,.06);
  --brand:#6FC3A6; --brand-2:#8AD3B9; --on-brand:#0E1512; --soft:#1B2A24;
  --mark:#F2C94C; --on-mark:#14201B;
  --ok:#5BCB93; --ok-bg:#16352A; --warn:#E8B44E; --warn-bg:#3A2E12; --bad:#F08B74; --bad-bg:#3D211B; --info:#8DB4EE; --info-bg:#1A2B44;
  --d-a:#1D2E45; --d-b:#43281E; --d-c:#22361F; --d-d:#33253F; --d-ink:#E6EEE9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.6vw,52px)}
h2{font-size:clamp(23px,3vw,34px)}
h3{font-size:18px;font-weight:600}
h4{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:72px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:32px}
.sec-head p{color:var(--muted);max-width:52ch;margin-top:10px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}
.ph{font-family:var(--f-mono);font-size:.92em;background:var(--soft);border-radius:5px;padding:0 4px;overflow-wrap:anywhere;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 .08em}
.grid-paper{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;border:1.5px solid transparent;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-2)}
.btn-mark{background:var(--mark);color:var(--on-mark)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{min-height:36px;padding:6px 14px;font-size:14px}
.btn-block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:12px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:15px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:16px;position:relative}
.logo-mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:3px;background:var(--mark)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a,.nav button{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;background:none;border:0;cursor:pointer}
.nav a:hover,.nav button:hover,.nav a.on{color:var(--ink);background:var(--soft)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);text-decoration:none}
.only-m{display:none}
.drawer{position:fixed;inset:0;z-index:70;background:rgba(10,16,13,.45)}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(320px,88vw);background:var(--surface);padding:calc(16px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:6px}
.drawer-panel a,.drawer-panel button.link{display:block;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600;font-size:17px;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.drawer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

/* hero */
.hero{padding-block:56px 64px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero h1{margin:16px 0 18px}
.hero-lead{font-size:18px;color:var(--muted);max-width:46ch;margin-bottom:28px}
.trust{display:flex;flex-wrap:wrap;gap:28px;margin-top:36px}
.trust b{display:block;font:600 24px/1.1 var(--f-display)}
.trust span{font-size:14px;color:var(--muted)}
.hero-visual{position:relative;display:grid;gap:14px}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.mock-row{display:flex;align-items:center;gap:12px}
.mock .tag{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px var(--bad-bg);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.mock-tilt{transform:rotate(-1.5deg);margin-left:28px}
.mock-tilt2{transform:rotate(1.2deg);margin-right:24px}
.check-stamp{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok);flex:none}

/* directions */
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dir{display:flex;flex-direction:column;gap:28px;justify-content:space-between;padding:20px;border-radius:var(--r);text-decoration:none;color:var(--d-ink);min-height:150px;transition:transform .2s}
.dir:hover{transform:translateY(-3px)}
.dir b{font:600 17px/1.25 var(--f-display)}
.dir-foot{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.d-a{background:var(--d-a)} .d-b{background:var(--d-b)} .d-c{background:var(--d-c)} .d-d{background:var(--d-d)}

/* course card */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ccard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;transition:transform .2s,box-shadow .2s}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ccard-top{position:relative;height:132px;padding:16px;color:var(--d-ink);display:flex;justify-content:space-between;align-items:flex-start;overflow:hidden}
.ccard-glyph{position:absolute;right:14px;bottom:-22px;font:700 104px/1 var(--f-display);opacity:.16}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.badge{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:6px;background:var(--mark);color:var(--on-mark)}
.ccard-body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.ccard-body p{color:var(--muted);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:auto;padding-top:8px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.price-line{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.price-line b{font-family:var(--f-display);font-weight:600}

/* path */
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:0;counter-reset:st}
.step{position:relative;padding:0 18px 0 0}
.step-num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--brand);color:var(--brand);font:600 16px var(--f-display);position:relative;z-index:1}
.step::before{content:"";position:absolute;top:21px;left:44px;right:0;border-top:2px dashed var(--line)}
.step:last-child::before{display:none}
.step h3{margin:16px 0 6px;font-size:16px}
.step p{font-size:14px;color:var(--muted)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.tile p{color:var(--muted);font-size:15px}
.tile .ti{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center}
.t-3{grid-column:span 3}.t-2{grid-column:span 2}.t-4{grid-column:span 4}
.tile.dark{background:var(--brand);color:var(--on-brand);border-color:transparent}
.tile.dark p{color:inherit;opacity:.85}
.tile.dark .ti{background:rgba(255,255,255,.16);color:inherit}

/* quiz */
.quiz{display:grid;grid-template-columns:.9fr 1.1fr;gap:32px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:36px;overflow:hidden}
.quiz-opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500}
.opt:hover{border-color:var(--brand)}
.quiz-prog{display:flex;gap:6px;margin:18px 0}
.quiz-prog i{flex:1;height:5px;border-radius:9px;background:var(--soft)}
.quiz-prog i.on{background:var(--brand)}

/* teachers */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.teacher{display:flex;flex-direction:column;gap:10px}
.avatar{aspect-ratio:4/5;max-width:100%;border-radius:var(--r);display:grid;place-items:center;font:700 48px var(--f-display);color:var(--d-ink);position:relative;overflow:hidden}
.avatar small{position:absolute;left:10px;bottom:10px;font:500 11px var(--f-mono);background:var(--surface);color:var(--ink);padding:5px 8px;border-radius:6px}
.teacher p{font-size:14px;color:var(--muted)}

/* reviews */
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.stars{display:flex;gap:2px;color:var(--warn)}
.who{display:flex;align-items:center;gap:10px;margin-top:auto}
.ava-s{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--d-ink);flex:none}
.who small{display:block;color:var(--muted);font-size:13px}

/* faq */
.faq{display:grid;gap:10px;max-width:860px}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.qa summary{list-style:none;cursor:pointer;padding:18px 20px;font-weight:600;display:flex;justify-content:space-between;gap:16px;align-items:center}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"+";font:500 22px/1 var(--f-mono);color:var(--brand);transition:transform .2s}
details.qa[open] summary::after{transform:rotate(45deg)}
details.qa .ans{padding:0 20px 18px;color:var(--muted);max-width:68ch}

/* cta */
.cta{background:var(--brand);color:var(--on-brand);border-radius:24px;padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;position:relative;overflow:hidden}
.cta p{opacity:.85;margin-top:12px}
.cta form{display:grid;gap:10px}
.cta .field input{background:var(--surface);color:var(--ink);border-color:transparent}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.field .err{font-size:13px;color:var(--bad)}
.small-note{font-size:13px;opacity:.8}

/* footer */
.ftr{border-top:1px solid var(--line);padding-block:40px;margin-top:40px;background:var(--surface)}
.ftr-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:28px}
.ftr h4{font-family:var(--f-body);font-size:14px;margin-bottom:10px}
.ftr a{display:block;color:var(--muted);text-decoration:none;font-size:14px;padding:3px 0}
.ftr a:hover{color:var(--ink)}

/* catalog */
.page-head{padding-block:40px 24px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted);margin-bottom:14px}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;padding:0 14px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.sel{min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;scrollbar-width:none}
.chips button{flex:none;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:48px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}

/* course page */
.c-hero{padding-block:36px 44px;color:var(--d-ink)}
.c-hero-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:36px;align-items:start}
.c-hero h1{margin:14px 0 14px}
.c-hero .lead{font-size:18px;max-width:52ch;opacity:.85}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fact{background:var(--surface);color:var(--ink);border-radius:12px;padding:14px}
.fact small{display:block;color:var(--muted);font-size:13px}
.fact b{font:600 16px var(--f-display)}
.subnav{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.subnav button{flex:none;padding:14px 12px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500}
.subnav button:hover{color:var(--ink);border-color:var(--brand)}
.learn{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.learn li{list-style:none;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.learn ul,.plain{padding:0;margin:0}
.tick{width:26px;height:26px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;flex:none}
.persona{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.persona .tile b{font:600 40px/1 var(--f-display);color:var(--brand)}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.mod summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px 20px}
.mod summary::-webkit-details-marker{display:none}
.mod-n{font:600 13px var(--f-mono);color:var(--brand);background:var(--soft);border-radius:8px;padding:6px 9px}
.mod summary small{color:var(--muted);font-size:13px;white-space:nowrap}
.mod ol{margin:0;padding:0 20px 18px 20px;list-style:none;display:grid;gap:2px}
.mod li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.mod li .k{font:500 12px var(--f-mono);color:var(--muted);width:34px;flex:none}
.mod li .t{flex:1;min-width:0}
.type{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:5px;background:var(--soft);color:var(--muted);flex:none}
.tariffs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
.tariff{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:16px;position:relative}
.tariff.pop{border-color:var(--brand);box-shadow:var(--shadow)}
.tariff.pop::before{content:"Выбирают чаще всего";position:absolute;top:-13px;left:24px;font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;background:var(--mark);color:var(--on-mark);padding:7px 10px;border-radius:6px}
.tariff .amt{font:600 30px/1.1 var(--f-display)}
.tariff .amt small{font:500 14px var(--f-body);color:var(--muted)}
.tariff ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;font-size:15px}
.tariff li{display:flex;gap:10px;align-items:flex-start}
.tariff li.no{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tariff li .ic{margin-top:2px}
.tariff .btn{margin-top:auto}
.result{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cert{aspect-ratio:1.414/1;max-width:100%;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.cert::after{content:"";position:absolute;inset:10px;border:1.5px solid var(--line);border-radius:8px;pointer-events:none}
.cert .seal{width:64px;height:64px;border-radius:50%;background:var(--mark);color:var(--on-mark);display:grid;place-items:center;align-self:flex-end}
.buybar{display:none}

/* checkout */
.co{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start;padding-block:28px 64px}
.stepper{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.stepper div{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted);padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.stepper div i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-mono);font-style:normal;background:var(--soft)}
.stepper div.on{color:var(--ink);border-color:var(--brand)}
.stepper div.on i{background:var(--brand);color:var(--on-brand)}
.stepper div.done i{background:var(--ok-bg);color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px}
.panel h2{font-size:22px;margin-bottom:6px}
.radios{display:grid;gap:10px;margin-top:18px}
.radio{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;border:1.5px solid var(--line);cursor:pointer;background:var(--bg)}
.radio input{margin-top:4px;accent-color:var(--brand);width:18px;height:18px;flex:none}
.radio:has(input:checked){border-color:var(--brand);background:var(--surface)}
.radio .rt{flex:1;min-width:0}
.radio .rt small{display:block;color:var(--muted);font-size:14px}
.radio .rp{font:600 15px var(--f-display);white-space:nowrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.form-grid .full{grid-column:1/-1}
.pay-box{margin-top:18px;border:1.5px dashed var(--line);border-radius:14px;padding:20px;display:flex;gap:14px;align-items:center;color:var(--muted)}
.co-actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.summary{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));display:grid;gap:14px}
.sum-row{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sum-row.total{font:600 18px var(--f-display);border-top:1px dashed var(--line);padding-top:14px}
.promo{display:flex;gap:8px}
.promo input{flex:1;min-width:0;min-height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.success{max-width:640px;margin:48px auto;text-align:center;display:grid;gap:16px;justify-items:center}
.success .big{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.next-list{text-align:left;display:grid;gap:10px;width:100%;margin:8px 0}
.next-list div{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}

/* cabinet */
.cab{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-block:28px 64px;align-items:start}
.side{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));display:grid;gap:14px}
.me{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.me small{display:block;color:var(--muted);font-size:13px}
.side nav{display:grid;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
.side nav a:hover{background:var(--surface);color:var(--ink)}
.side nav a.on{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--brand)}
.side nav a .cnt{margin-left:auto;font:500 12px var(--f-mono);background:var(--bad-bg);color:var(--bad);padding:2px 7px;border-radius:99px}
.tabbar{display:none}
.cab h1{font-size:clamp(24px,3vw,32px)}
.cab-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:22px}
.c-8{grid-column:span 8}.c-4{grid-column:span 4}.c-6{grid-column:span 6}.c-12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:16px}
.card-h a{font-size:14px;color:var(--brand);text-decoration:none;font-weight:600}
.next-lesson{background:var(--brand);color:var(--on-brand);border:0}
.next-lesson .eyebrow{color:inherit;opacity:.8}
.next-lesson h2{font-size:22px;margin:10px 0 6px}
.next-lesson .btn-mark{margin-top:16px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 28px var(--f-display)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--soft);color:var(--muted)}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow small{display:block;color:var(--muted);font-size:13px}
.date-box{width:48px;text-align:center;flex:none;border-radius:10px;background:var(--soft);padding:6px 0}
.date-box b{display:block;font:600 17px/1.1 var(--f-display)}
.date-box small{font:500 10px var(--f-mono);text-transform:uppercase;color:var(--muted)}
.feedback{background:var(--bg);border-radius:12px;padding:14px;font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:18px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:200px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.day-h b{font:600 18px var(--f-display);color:var(--ink)}
.ev{border-radius:10px;padding:9px 10px;font-size:13px;line-height:1.35}
.ev time{display:block;font:500 11px var(--f-mono);margin-bottom:2px;opacity:.8}
.ev-live{background:var(--d-a);color:var(--d-ink)}
.ev-dl{background:var(--bad-bg);color:var(--bad)}
.ev-cons{background:var(--d-c);color:var(--d-ink)}
.ev-self{background:var(--soft);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.seg button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lesson-row{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:12px;text-decoration:none;min-width:0}
.lesson-row:hover{background:var(--bg)}
.lesson-row .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.st-done{background:var(--ok-bg);color:var(--ok)}.st-cur{background:var(--mark);color:var(--on-mark)}.st-lock{background:var(--soft);color:var(--muted)}
.lesson-row.locked{opacity:.6;pointer-events:none}
.hw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.hw:hover{border-color:var(--brand)}
.hw small{color:var(--muted);font-size:13px}
.hw-list{display:grid;gap:10px;margin-top:16px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,16,13,.5);display:grid;place-items:center;padding:16px}
.modal-in{background:var(--surface);border-radius:20px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:24px;display:grid;gap:14px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;display:flex;gap:12px;align-items:center;color:var(--muted);cursor:pointer}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat b{display:block;font:600 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:13px}
.modbars{display:grid;gap:14px}
.modbar{display:grid;grid-template-columns:minmax(0,1fr) 3fr auto;gap:14px;align-items:center;font-size:14px}
.modbar .bar{height:10px}
.modbar span:last-child{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;width:40px;text-align:right}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.ach div{border-radius:14px;padding:16px;text-align:center;display:grid;gap:8px;justify-items:center;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.ach div.got{background:var(--d-c);color:var(--d-ink);border-color:transparent}
.ach div:not(.got){color:var(--muted)}

/* lesson */
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:20px 64px;align-items:start}
.player{aspect-ratio:16/9;max-width:100%;border-radius:18px;background:#0F1B16;color:#E6EEE9;display:grid;place-items:center;position:relative;overflow:hidden}
.player::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px}
.player button{position:relative;width:76px;height:76px;border-radius:50%;border:0;background:#FFD84D;color:#14201B;display:grid;place-items:center;cursor:pointer}

.player .pbar .bar i{background:#FFD84D}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;padding:12px 14px;border:0;background:none;border-bottom:2px solid transparent;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.prose{display:grid;gap:14px;max-width:68ch}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.note{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:14px 16px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.proto-tag{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;font:500 11px var(--f-mono);background:var(--mark);color:var(--on-mark);padding:6px 9px;border-radius:6px;opacity:.9}

/* responsive */
@media (max-width:1000px){

  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;text-decoration:none;color:var(--muted);padding:6px 0;border-radius:10px}
  .tabbar a.on{color:var(--brand);background:var(--soft)}
  body.has-bar{padding-bottom:84px}
  .c-8,.c-4,.c-6{grid-column:span 12}
  .week{grid-template-columns:1fr}.day{min-height:0}.day:not(.today) .empty-day{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lesson-grid{grid-template-columns:1fr}
  .buybar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .buybar small{display:block;color:var(--muted);font-size:12px}

  .proto-tag{display:none}
}
@media (max-width:640px){

  .cgrid{grid-template-columns:1fr}

  .facts{grid-template-columns:1fr 1fr}

  .modbar{grid-template-columns:1fr auto}.modbar .bar{grid-column:1/-1;grid-row:2}
  .btns .btn{flex:1 1 auto}
  .hdr .btn-primary{display:none}

  .stepper div{font-size:13px;padding-right:10px}
  .hero h1 .ph{white-space:normal}
}
.nav a,.nav button,.logo span:last-child{white-space:nowrap}
.dirs{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}.dir b{overflow-wrap:anywhere}

.summary{grid-template-columns:minmax(0,1fr)}.sum-row span{min-width:0;overflow-wrap:anywhere}.sum-row span:last-child{text-align:right}

const CAB_TABS = [['cabinet','Главная','home'],['cabinet-schedule','Расписание','cal'],['cabinet-lessons','Уроки','book'],['cabinet-homework','Задания','doc'],['cabinet-progress','Прогресс','chart']];
function totalLessons(){ return MODULES.reduce((a,m)=>a+m.ls.length,0); }
function doneLessons(){ return Object.values(DONE).reduce((a,b)=>a+b,0); }
function pct(){ return Math.round(doneLessons()/totalLessons()*100); }
function ring(p,size=132){
  const r=(size-16)/2, L=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--brand)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L*p/100} ${L}"/></svg><b>${p}%</b></div>`;
}

function pLesson(m,l){

  const tab = S.lessonTab;
  let content;
  if(tab==='notes') content = `<div class="prose"><p>[Краткий конспект урока: основные мысли, определения и примеры. Ученик может вернуться к нему в любой момент.]</p><ul><li>[Главная мысль 1]</li><li>[Главная мысль 2]</li><li>[Главная мысль 3]</li></ul><div class="note"><b>Совет наставника.</b> Посмотрите урок целиком, а потом попробуйте повторить пример сами, не подглядывая.</div></div>`;
  else if(tab==='files') content = `<div class="list" style="max-width:560px">${['Презентация урока.pdf','Шаблон для практики','Дополнительное чтение'].map(f=>`<div class="li"><span style="color:var(--brand)">${ic('doc')}</span><span class="grow"><b style="font-size:15px">${f}</b><small>[описание материала]</small></span><button class="btn btn-ghost btn-sm" data-act="file">Открыть</button></div>`).join('')}</div>`;
  else content = `<div class="prose"><p><b>Задание к уроку.</b> [Что нужно сделать после урока и как сдать работу.]</p></div><button class="btn btn-primary" style="margin-top:16px" data-act="open-hw" data-v="4">Перейти к заданию</button>`;
  return `<div class="wrap" style="padding-top:20px"><div class="crumbs"><a href="#cabinet">Кабинет</a><span>/</span><a href="#cabinet-lessons">Уроки</a><span>/</span><span>Модуль ${m}</span></div></div>
  <div class="wrap lesson-grid"><div style="min-width:0">
    <div class="player"><button data-act="play" aria-label="Смотреть урок">${ic('play',34)}</button><div class="pbar"><span>04:12</span><span class="bar"><i style="width:32%"></i></span><span>13:05</span></div></div>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-top:20px"><div style="min-width:0"><span class="eyebrow">Урок ${m}.${l} · ${les[1]}</span><h1 style="font-size:clamp(22px,3vw,30px);margin-top:8px">${les[0]}</h1></div>
      <button class="btn btn-ghost btn-sm" data-act="done-lesson">${ic('check',16)} Отметить пройденным</button></div>
    <div class="tabs" role="tablist">${[['notes','Конспект'],['files','Материалы'],['task','Задание']].map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-act="ltab" data-v="${k}">${t}</button>`).join('')}</div>
    ${content}
    <div class="co-actions" style="border-top:1px solid var(--line);padding-top:20px;margin-top:32px">${prev?`<a class="btn btn-ghost" href="#${prev}">${ic('left',18)} Предыдущий</a>`:'<span></span>'}${next?`<a class="btn btn-primary" href="#${next}">Следующий урок ${ic('arrow',18)}</a>`:''}</div>
  </div>
  <aside class="card"><div class="card-h"><h3>Модуль ${m}</h3><small class="muted">${Math.min(DONE[m]||0,mod.ls.length)}/${mod.ls.length}</small></div><p class="muted" style="font-size:14px;margin:-6px 0 10px">${mod.t}</p>

/* ---------- роутер ---------- */
let pendingScroll = null;
function route(){ return (location.hash||'#home').slice(1) || 'home'; }
function render(){
  const r = route(); const app = document.getElementById('app');
  let html, cab = false;
  if(r==='home') html = pHome();
  else if(r==='catalog') html = pCatalog();
  else if(r.startsWith('course-')) html = pCourse(r.split('-')[1]);
  else if(r==='checkout') html = pCheckout();
  else if(r.startsWith('lesson-')){ const [,m,l]=r.split('-'); html = pLesson(+m||1,+l||1); }
  else if(r.startsWith('cabinet')){ cab = true; const inner = r==='cabinet-schedule'?pSchedule():r==='cabinet-lessons'?pLessons():r==='cabinet-homework'?pHomework():r==='cabinet-progress'?pProgress():pCabinet(); html = cabShell(CAB_TABS.some(t=>t[0]===r)?r:'cabinet', inner); }
  else html = pHome();
  app.innerHTML = html + (S.hwOpen?hwModal():'');
  document.getElementById('hdr').innerHTML = header(r);
  document.body.classList.toggle('has-bar', cab || r.startsWith('course-'));
  document.getElementById('ftr').hidden = cab || r==='checkout' || r.startsWith('lesson-');
}
function go(r){ if(route()===r){ render(); } else { location.hash = r; } }
window.addEventListener('hashchange', ()=>{ S.hwOpen=null; render(); if(pendingScroll){ const id=pendingScroll; pendingScroll=null; requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView({block:'start'})); } else window.scrollTo(0,0); });

/* ---------- события ---------- */
document.addEventListener('click', e=>{
  const sc = e.target.closest('[data-scroll]');
  if(sc){ e.preventDefault(); const id=sc.dataset.scroll; const want=sc.dataset.route; document.getElementById('drawer')?.setAttribute('hidden','');
    if(want && route()!==want){ pendingScroll=id; location.hash=want; } else document.getElementById(id)?.scrollIntoView({block:'start'}); return; }
  const dl = e.target.closest('[data-dir]'); if(dl){ S.dir = dl.dataset.dir; S.level='all'; S.dur='all'; S.q=''; if(route()==='catalog') render(); }
  const hwl = e.target.closest('[data-hw]'); if(hwl){ S.hwOpen = +hwl.dataset.hw; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const v = a.dataset.v, act = a.dataset.act;
  switch(act){
    case 'menu': { const d=document.getElementById('drawer'); d.hidden=!d.hidden; break; }
    case 'quiz': S.quiz.push(+v); render(); document.getElementById('quiz').scrollIntoView({block:'nearest'}); break;
    case 'quiz-back': S.quiz.pop(); render(); break;
    case 'quiz-reset': S.quiz=[]; render(); break;
    case 'dir': S.dir=v; render(); break;
    case 'reset-filters': S.dir='all'; S.level='all'; S.dur='all'; S.q=''; render(); break;
    case 'buy': S.tariff=v; S.step=1; S.promo=false; save(); go('checkout'); break;
    case 'trial': toast('Ссылку на пробный урок пришлём на почту (в макете ничего не отправляется)'); break;
    case 'tariff': S.tariff=a.value; save(); render(); break;
    case 'plan': S.plan=a.value; render(); break;
    case 'pay': S.pay=a.value; break;
    case 'who': S.who=v; keepForm(); render(); break;
    case 'step': keepForm(); S.step=+v; render(); window.scrollTo(0,0); break;
    case 'promo': { const p=document.getElementById('promo'); if(p&&p.value.trim()){ S.promo=true; render(); toast('Промокод применён'); } else toast('Введите промокод'); break; }
    case 'pay-now': S.paid=true; S.step=4; save(); render(); window.scrollTo(0,0); break;
    case 'join': toast('В настоящем кабинете здесь откроется видеосвязь'); break;
    case 'hwf': S.hwFilter=v; render(); break;
    case 'open-hw': S.hwOpen=+v; if(!route().startsWith('cabinet-homework')&&a.closest('.cab')===null&&!route().startsWith('lesson')){} render(); break;
    case 'close-hw': if(e.target===a || a.tagName==='BUTTON'){ S.hwOpen=null; render(); } break;
    case 'ltab': S.lessonTab=v; render(); break;
    case 'play': toast('Здесь будет видео урока'); break;
    case 'done-lesson': toast('Урок отмечен пройденным'); break;
    case 'file': toast('Материал откроется в новой вкладке'); break;
    case 'week': toast('Переключение недель работает в настоящей версии'); break;
    case 'cal': toast('Здесь будет ссылка для Google/Яндекс Календаря'); break;
  }
});
function keepForm(){ ['name','email','phone'].forEach(k=>{ const el=document.getElementById('f-'+k); if(el) S.form[k]=el.value; }); }
document.addEventListener('submit', e=>{
  const f = e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const kind = f.dataset.form;
  if(kind==='lead'){ const n=f.querySelector('#lead-name').value.trim(), p=f.querySelector('#lead-phone').value.trim(); if(!n||!p){ toast('Заполните имя и контакт'); return; } f.reset(); toast('Заявка принята! Это макет, поэтому она никуда не ушла.'); }
  if(kind==='contacts'){ keepForm(); let ok=true;
    const nm=document.getElementById('f-name'), em=document.getElementById('f-email');
    nm.nextElementSibling.hidden = !!S.form.name.trim(); if(!S.form.name.trim()) ok=false;
    const emOk=/^\S+@\S+\.\S+$/.test(S.form.email); em.nextElementSibling.hidden = emOk; if(!emOk) ok=false;
    if(ok){ S.step=3; render(); window.scrollTo(0,0); } }
  if(kind==='hw'){ const h=HW.find(x=>x.id===S.hwOpen); if(h){ h.st='review'; h.fb=''; } S.hwOpen=null; render(); toast('Задание отправлено на проверку'); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='cat-q'){ S.q=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById('cat-q'); q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} }
});
document.addEventListener('change', e=>{
  if(e.target.id==='cat-level'){ S.level=e.target.value; render(); }
  if(e.target.id==='cat-dur'){ S.dur=e.target.value; render(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.hwOpen){ S.hwOpen=null; render(); } });
document.getElementById('ftr').innerHTML = footer();
render();
</script>
</body>
